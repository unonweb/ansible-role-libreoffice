---
# USER
# ----
libreoffice_user:

# APT
# ---
libreoffice_apt_state: absent
libreoffice_apt_install:
- libreoffice
- libreoffice-writer
- libreoffice-calc
- libreoffice-impress
- libreoffice-base
- libreoffice-draw
- libreoffice-math

# FLATPAK
# -------
libreoffice_flatpak_state: present
libreoffice_flatpak_overrides:
libreoffice_flatpak_permissions:
- table: "background"
  id: "background"
  value: "yes"
- table: "notifications"
  id: "notification"
  value: "yes"