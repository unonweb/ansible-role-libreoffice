---
# flatpak overrides
- tags: [libreoffice-flatpak-overrides]
  when: libreoffice_flatpak_overrides != None
  block:

  # check vars
  - name: Check vars for libreoffice-flatpak-overrides
    ansible.builtin.assert:
      that:
      - libreoffice_user != None

  # make sure user exists
  - name: Check if user exists {{ libreoffice_user }}
    command: "getent passwd {{ libreoffice_user }}"
    changed_when: false

  # mkdir overrides
  - name: Mkdir {{ __libreoffice_flatpak_overrides_dir }}
    become: true
    ansible.builtin.file:
      state: directory
      mode: u=rwx,g=,o=rx
      owner: "{{ libreoffice_user }}"
      group: "{{ libreoffice_user }}"
      path: "{{ __libreoffice_flatpak_overrides_dir }}"

  # flatpak overrides
  - name: Template overrides {{ __libreoffice_flatpak_overrides_dir }}/{{ __libreoffice_flatpak_id }}
    become: true
    ansible.builtin.template:
      src: flatpak-overrides-generic.j2
      dest: "{{ __libreoffice_flatpak_overrides_dir }}/{{ __libreoffice_flatpak_id }}"
      owner: "{{ libreoffice_user }}"
      group: "{{ libreoffice_user }}"
      mode: u=rw,g=,o=r # world readable
